name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go vet ./...
      - run: go test ./...
      - name: Client unit tests
        shell: bash
        run: |
          files=$(find web/js -name '*.test.js' -o -name '*.test.mjs' | sort)
          if [ -n "$files" ]; then node --test $files; else echo "no client tests found"; fi

  mac:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:mac
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch the packaged app (smoke test)
        working-directory: desktop
        env:
          WILDCALL_SMOKE: '1'
          WILDCALL_SMOKE_DEEP: '1'
        run: |
          APP=$(ls -d dist/mac-$(uname -m | sed s/x86_64/x64/)/Wildcall.app dist/mac/Wildcall.app 2>/dev/null | head -1)
          export WILDCALL_USER_DATA="$RUNNER_TEMP/wildcall-smoke"
          "$APP/Contents/MacOS/Wildcall" | tee smoke.txt
          grep -q SMOKE_OK smoke.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wildcall-mac
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
          if-no-files-found: error

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
      - name: Engine tests on Windows
        run: go test ./internal/game/ ./internal/save/ ./internal/server/ ./internal/world/
      - name: Launch the packaged app (smoke test)
        working-directory: desktop
        shell: pwsh
        env:
          WILDCALL_SMOKE: '1'
          WILDCALL_SMOKE_DEEP: '1'
        run: |
          $env:WILDCALL_USER_DATA = Join-Path $env:RUNNER_TEMP 'wildcall-smoke'
          $exe = Join-Path (Get-Location) 'dist\win-unpacked\Wildcall.exe'
          if (-not (Test-Path $exe)) { throw "not found: $exe" }
          $p = Start-Process -FilePath $exe -PassThru -Wait -RedirectStandardOutput smoke.txt -RedirectStandardError smoke-err.txt
          Get-Content smoke.txt
          Get-Content smoke-err.txt | Select-Object -Last 30
          if ($p.ExitCode -ne 0) { throw "Wildcall.exe exited with $($p.ExitCode)" }
          if (-not (Select-String -Path smoke.txt -Pattern 'SMOKE_OK' -Quiet)) { throw 'no SMOKE_OK in output' }
          if (Get-Process -Name wildcall -ErrorAction SilentlyContinue) { throw 'engine process left running' }
      - uses: actions/upload-artifact@v4
        with:
          name: wildcall-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
